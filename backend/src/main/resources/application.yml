spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fairshare}
    username: ${SPRING_DATASOURCE_USERNAME:fairshare}
    password: ${SPRING_DATASOURCE_PASSWORD:fairshare}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: ${PORT:8080}
  servlet:
    context-path: ${FAIRSHARE_CONTEXT_PATH:/}
springdoc:
  swagger-ui:
    path: /swagger-ui
jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  expirationMinutes: ${JWT_EXPIRATION_MINUTES:15}
  refreshExpirationDays: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  refreshCookieName: ${JWT_REFRESH_COOKIE_NAME:fairshare_refresh}
fairshare:
  cors:
    allowed-origins: ${FAIRSHARE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_budget_item_suspensions
              - column:
                  name: budget_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: budget_item_suspensions
            baseColumnNames: budget_item_id
            referencedTableName: budget_items
            referencedColumnNames: id
            constraintName: fk_budget_item_suspensions_budget_item
            onDelete: CASCADE
        - createIndex:
            tableName: budget_item_suspensions
            indexName: idx_budget_item_suspensions_item_dates
            columns:
              - column:
                  name: budget_item_id
              - column:
                  name: start_date
              - column:
                  name: end_date

  - changeSet:
      id: 014-add-savings-accounts
      author: codex
      preConditions:

            tableName: persons
      changes:
        - createTable:
            tableName: persons
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 004b-seed-default-persons
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM persons
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ;
            sql: |
              INSERT INTO persons (name)
              VALUES
                ('Person 1'),
                ('Person 2');

  - changeSet:
      id: 005-add-person-id-to-budget-items
      author: codex
      preConditions:
        onFail: MARK_RAN

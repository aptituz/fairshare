  - changeSet:
      id: 015-add-savings-account-balances
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: savings_account_balances
      changes:
        - createTable:
            tableName: savings_account_balances
            columns:
              - column:
                  name: id

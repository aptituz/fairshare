      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: category_correction
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 008b-backfill-budget-items-category-correction
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        columnExists:

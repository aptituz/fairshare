            initiallyDeferred: false
            onDelete: SET NULL
            onUpdate: RESTRICT
            remarks: "SQLite ignores addForeignKeyConstraint in Liquibase."

  - changeSet:
      id: 006-add-budget-items-active
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: active
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 006b-backfill-budget-items-active
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        columnExists:
          tableName: budget_items
          columnName: active
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ;
            sql: |
              UPDATE budget_items
              SET active = TRUE
              WHERE active IS NULL;

  - changeSet:
      id: 007-add-budget-items-planned
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: planned
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: planned
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 007b-backfill-budget-items-planned
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        columnExists:
          tableName: budget_items

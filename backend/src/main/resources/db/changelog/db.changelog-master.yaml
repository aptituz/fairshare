databaseChangeLog:
  - changeSet:
      id: 001-create-categories
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: rank
                  type: INTEGER
                  constraints:
                    nullable: false


  - changeSet:
      id: 002-create-budget-items
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: budget_items
      changes:
        - createTable:
            tableName: budget_items
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(14,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: frequency
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: category_id
                  type: INTEGER

  - changeSet:
      id: 002b-budget-items-fk
      author: codex
      dbms: "!sqlite"
      changes:
        - addForeignKeyConstraint:
            baseTableName: budget_items
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_budget_items_category
            validate: false
            deferrable: false
            initiallyDeferred: false
            onDelete: SET NULL
            onUpdate: RESTRICT
            remarks: "SQLite ignores addForeignKeyConstraint in Liquibase."

  - changeSet:
      id: 003-seed-default-categories
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM categories
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ;
            sql: |
              INSERT INTO categories (name, type, rank)
              VALUES
                ('Gehalt', 'INCOME', 1),
                ('Kindergeld', 'INCOME', 2),
                ('Elterngeld', 'INCOME', 3),
                ('Geschenke', 'INCOME', 4),
                ('Bonuszahlungen', 'INCOME', 5),
                ('Krankengeld', 'INCOME', 6);

              INSERT INTO categories (name, type, rank)
              VALUES
                ('Wohnen', 'EXPENSE', 7),
                ('Kommunikation', 'EXPENSE', 8),
                ('Versicherungen', 'EXPENSE', 9),
                ('Unterhaltung', 'EXPENSE', 10),
                ('Lebenshaltungskosten', 'EXPENSE', 11),
                ('Vorsorgen/Sparen', 'EXPENSE', 12),
                ('Freizeit', 'EXPENSE', 13);

  - changeSet:
      id: 004-create-persons
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: persons
      changes:
        - createTable:
            tableName: persons
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 005-add-person-id-to-budget-items
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: person_id
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: person_id
                  type: INTEGER

  - changeSet:
      id: 005b-budget-items-person-fk
      author: codex
      dbms: "!sqlite"
      changes:
        - addForeignKeyConstraint:
            baseTableName: budget_items
            baseColumnNames: person_id
            referencedTableName: persons
            referencedColumnNames: id
            constraintName: fk_budget_items_person
            validate: false
            deferrable: false
            initiallyDeferred: false
            onDelete: SET NULL
            onUpdate: RESTRICT
            remarks: "SQLite ignores addForeignKeyConstraint in Liquibase."

  - changeSet:
      id: 006-add-budget-items-active
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: active
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 007-add-budget-items-planned
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: planned
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: planned
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 008-add-budget-items-category-correction
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: category_correction
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: category_correction
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 009-drop-budget-items-active
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        columnExists:
          tableName: budget_items
          columnName: active
      changes:
        - dropColumn:
            tableName: budget_items
            columnName: active

  - changeSet:
      id: 010-add-budget-items-previous
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: previous_budget_item_id
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: previous_budget_item_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: budget_items
            baseColumnNames: previous_budget_item_id
            referencedTableName: budget_items
            referencedColumnNames: id
            constraintName: fk_budget_items_previous
            onDelete: SET NULL

  - changeSet:
      id: 011-add-budget-items-root
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: root_budget_item_id
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: root_budget_item_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: budget_items
            baseColumnNames: root_budget_item_id
            referencedTableName: budget_items
            referencedColumnNames: id
            constraintName: fk_budget_items_root
            onDelete: SET NULL

  - changeSet:
      id: 013-add-budget-item-suspensions
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: budget_item_suspensions
      changes:
        - createTable:
            tableName: budget_item_suspensions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_budget_item_suspensions
              - column:
                  name: budget_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: budget_item_suspensions
            baseColumnNames: budget_item_id
            referencedTableName: budget_items
            referencedColumnNames: id
            constraintName: fk_budget_item_suspensions_budget_item
            onDelete: CASCADE
        - createIndex:
            tableName: budget_item_suspensions
            indexName: idx_budget_item_suspensions_item_dates
            columns:
              - column:
                  name: budget_item_id
              - column:
                  name: start_date
              - column:
                  name: end_date

  - changeSet:
      id: 014-add-savings-accounts
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: savings_accounts
      changes:
        - createTable:
            tableName: savings_accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_savings_accounts
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: owner_person_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: savings_accounts
            baseColumnNames: owner_person_id
            referencedTableName: persons
            referencedColumnNames: id
            constraintName: fk_savings_accounts_owner
            onDelete: RESTRICT
        - createIndex:
            tableName: savings_accounts
            indexName: idx_savings_accounts_owner
            columns:
              - column:
                  name: owner_person_id

  - changeSet:
      id: 015-add-savings-account-balances
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: savings_account_balances
      changes:
        - createTable:
            tableName: savings_account_balances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_savings_account_balances
              - column:
                  name: savings_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: balance_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: balance_amount
                  type: NUMERIC(14,2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: savings_account_balances
            baseColumnNames: savings_account_id
            referencedTableName: savings_accounts
            referencedColumnNames: id
            constraintName: fk_savings_account_balances_account
            onDelete: CASCADE
        - createIndex:
            tableName: savings_account_balances
            indexName: idx_savings_account_balances_account_date
            columns:
              - column:
                  name: savings_account_id
              - column:
                  name: balance_date

  - changeSet:
      id: 016-savings-accounts-owner-nullable
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        tableExists:
          tableName: savings_accounts
      changes:
        - dropNotNullConstraint:
            tableName: savings_accounts
            columnName: owner_person_id
            columnDataType: BIGINT

  - changeSet:
      id: 017-add-person-auth-fields
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: persons
            columnName: username
      changes:
        - addColumn:
            tableName: persons
            columns:
              - column:
                  name: username
                  type: VARCHAR(100)
              - column:
                  name: password_hash
                  type: VARCHAR(64)
              - column:
                  name: password_salt
                  type: VARCHAR(64)
        - addNotNullConstraint:
            tableName: persons
            columnName: username
            columnDataType: VARCHAR(100)
        - addUniqueConstraint:
            tableName: persons
            columnNames: username
            constraintName: uq_persons_username

  - changeSet:
      id: 004b-seed-default-persons
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM persons
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ;
            sql: |
              INSERT INTO persons (name, username)
              VALUES
                ('Person 1', 'person1'),
                ('Person 2', 'person2');

  - changeSet:
      id: 018-add-savings-account-dates
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        tableExists:
          tableName: savings_accounts
      changes:
        - addColumn:
            tableName: savings_accounts
            columns:
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE

  - changeSet:
      id: 019-add-budget-items-due-date
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          columnExists:
            tableName: budget_items
            columnName: due_date
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: due_date
                  type: DATE

  - changeSet:
      id: 020-change-budget-items-due-date-to-month
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        columnExists:
          tableName: budget_items
          columnName: due_date
      changes:
        - addColumn:
            tableName: budget_items
            columns:
              - column:
                  name: due_month
                  type: VARCHAR(7)
        - sql:
            dbms: postgresql
            sql: |
              update budget_items
              set due_month = to_char(due_date, 'YYYY-MM')
              where due_date is not null;
        - dropColumn:
            tableName: budget_items
            columnName: due_date
        - renameColumn:
            tableName: budget_items
            oldColumnName: due_month
            newColumnName: due_date

databaseChangeLog:
  - changeSet:
      id: 001-create-categories
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: rank
                  type: INTEGER
                  constraints:
                    nullable: false


  - changeSet:
      id: 002-create-budget-items
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: budget_items
      changes:
        - createTable:
            tableName: budget_items
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(14,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: frequency
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: category_id
                  type: INTEGER

  - changeSet:
      id: 002b-budget-items-fk
      author: codex
      dbms: "!sqlite"
      changes:
        - addForeignKeyConstraint:
            baseTableName: budget_items
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_budget_items_category
            validate: false
            deferrable: false
            initiallyDeferred: false
            onDelete: SET NULL
            onUpdate: RESTRICT
            remarks: "SQLite ignores addForeignKeyConstraint in Liquibase."

  - changeSet:
      id: 003-seed-default-categories
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM categories
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ;
            sql: |
              INSERT INTO categories (name, type, rank)
              VALUES
                ('Gehalt', 'INCOME', 1),
                ('Kindergeld', 'INCOME', 2),
                ('Elterngeld', 'INCOME', 3),
                ('Geschenke', 'INCOME', 4),
                ('Bonuszahlungen', 'INCOME', 5),
                ('Krankengeld', 'INCOME', 6);

              INSERT INTO categories (name, type, rank)
              VALUES
                ('Wohnen', 'EXPENSE', 7),
                ('Kommunikation', 'EXPENSE', 8),
                ('Versicherungen', 'EXPENSE', 9),
                ('Unterhaltung', 'EXPENSE', 10),
                ('Lebenshaltungskosten', 'EXPENSE', 11),
                ('Vorsorgen/Sparen', 'EXPENSE', 12),
                ('Freizeit', 'EXPENSE', 13);

  - changeSet:
      id: 004-create-persons
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN

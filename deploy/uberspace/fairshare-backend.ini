[program:fairshare-backend]
command=java -jar %(ENV_HOME)s/fairshare/backend.jar
directory=%(ENV_HOME)s/fairshare
autostart=true
autorestart=true
startsecs=10
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/fairshare/logs/backend.log
environment=PORT="0000",FAIRSHARE_CONTEXT_PATH="/fairshare",SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/fairshare",SPRING_DATASOURCE_USERNAME="fairshare",SPRING_DATASOURCE_PASSWORD="fairshare",JWT_SECRET="change-me-change-me-change-me-change-me",FAIRSHARE_CORS_ALLOWED_ORIGINS="https://YOUR.DOMAIN"

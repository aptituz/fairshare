name: Dependabot Auto-merge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge passing Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list \
            --repo "$REPO" \
            --author "dependabot[bot]" \
            --state open \
            --json number,url,headRefName \
            --jq '.[] | "\(.number) \(.url) \(.headRefName)"')

          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          while IFS=" " read -r number url branch; do
            echo "Checking PR #${number}: ${branch}"

            # Collect all check conclusions for the PR head
            conclusions=$(gh pr checks "$number" \
              --repo "$REPO" \
              --json name,state \
              --jq '.[].state' 2>/dev/null || true)

            if [ -z "$conclusions" ]; then
              echo "  -> No checks found yet, skipping."
              continue
            fi

            if echo "$conclusions" | grep -qvE "^(SUCCESS|success|NEUTRAL|neutral|SKIPPED|skipped)$"; then
              echo "  -> Checks not all passing, skipping."
              continue
            fi

            echo "  -> All checks passed, merging."
            gh pr merge "$number" \
              --repo "$REPO" \
              --squash \
              --auto \
              --delete-branch || echo "  -> Merge failed (may already be merged or conflicts), skipping."
          done <<< "$prs"

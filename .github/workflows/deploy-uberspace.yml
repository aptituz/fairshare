name: Deploy Uberspace

on:
  push:
    branches: ["main"]

env:
  FAIRSHARE_RELEASE_ID: ${{ github.run_id }}-${{ github.sha }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test
        run: ./gradlew test

  deploy:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend
        working-directory: backend
        run: |
          ./gradlew bootJar -x test
          jar_path=$(ls build/libs/*.jar | head -n 1)
          cp "$jar_path" ../backend.jar

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: /
          VITE_API_BASE_URL: /fairshare
        run: |
          npm ci
          npm run build

      - name: Ensure remote folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/fairshare/releases ~/fairshare/logs ~/fairshare/scripts ~/html ~/etc/services.d
            mkdir -p ~/fairshare/releases/${{ env.FAIRSHARE_RELEASE_ID }}/frontend

      - name: Configure supervisord service
        uses: appleboy/ssh-action@v1.0.3
        env:
          FAIRSHARE_BACKEND_PORT: ${{ secrets.FAIRSHARE_BACKEND_PORT }}
          FAIRSHARE_DB_URL: ${{ secrets.FAIRSHARE_DB_URL }}
          FAIRSHARE_DB_USERNAME: ${{ secrets.FAIRSHARE_DB_USERNAME }}
          FAIRSHARE_DB_PASSWORD: ${{ secrets.FAIRSHARE_DB_PASSWORD }}
          FAIRSHARE_JWT_SECRET: ${{ secrets.FAIRSHARE_JWT_SECRET }}
          FAIRSHARE_CORS_ALLOWED_ORIGINS: ${{ secrets.FAIRSHARE_CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FAIRSHARE_BACKEND_PORT,FAIRSHARE_DB_URL,FAIRSHARE_DB_USERNAME,FAIRSHARE_DB_PASSWORD,FAIRSHARE_JWT_SECRET,FAIRSHARE_CORS_ALLOWED_ORIGINS
          script: |
            cat > ~/etc/services.d/fairshare-backend.ini <<EOF
            [program:fairshare-backend]
            command=java -jar %(ENV_HOME)s/fairshare/current/backend.jar --server.port=${FAIRSHARE_BACKEND_PORT} --server.servlet.context-path=/fairshare
            directory=%(ENV_HOME)s/fairshare/current
            autostart=true
            autorestart=true
            startsecs=10
            redirect_stderr=true
            stdout_logfile=%(ENV_HOME)s/fairshare/logs/backend.log
            environment=PORT="${FAIRSHARE_BACKEND_PORT}",SERVER_PORT="${FAIRSHARE_BACKEND_PORT}",FAIRSHARE_CONTEXT_PATH="/fairshare",SPRING_DATASOURCE_URL="${FAIRSHARE_DB_URL}",SPRING_DATASOURCE_USERNAME="${FAIRSHARE_DB_USERNAME}",SPRING_DATASOURCE_PASSWORD="${FAIRSHARE_DB_PASSWORD}",JWT_SECRET="${FAIRSHARE_JWT_SECRET}",FAIRSHARE_CORS_ALLOWED_ORIGINS="${FAIRSHARE_CORS_ALLOWED_ORIGINS}"
            EOF
            supervisorctl reread
            supervisorctl update

      - name: Upload backend jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend.jar
          target: ~/fairshare/releases/${{ env.FAIRSHARE_RELEASE_ID }}/

      - name: Upload frontend assets
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: ~/fairshare/releases/${{ env.FAIRSHARE_RELEASE_ID }}/frontend/
          remote_host: ${{ secrets.UBERSPACE_HOST }}
          remote_user: ${{ secrets.UBERSPACE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > ~/fairshare/scripts/deploy_release.sh <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail

            APP_ROOT="${HOME}/fairshare"
            RELEASES_DIR="${APP_ROOT}/releases"
            CURRENT_LINK="${APP_ROOT}/current"
            PREVIOUS_LINK="${APP_ROOT}/previous"
            PUBLIC_ROOT="${HOME}/html"
            PUBLIC_LINK="${PUBLIC_ROOT}/fairshare"
            SERVICE_NAME="fairshare-backend"
            HEALTHCHECK_URL="${FAIRSHARE_HEALTHCHECK_URL:?FAIRSHARE_HEALTHCHECK_URL is required}"
            RELEASE_ID="${FAIRSHARE_RELEASE_ID:?FAIRSHARE_RELEASE_ID is required}"
            HEALTHCHECK_ATTEMPTS="${FAIRSHARE_HEALTHCHECK_ATTEMPTS:-24}"
            HEALTHCHECK_DELAY_SECONDS="${FAIRSHARE_HEALTHCHECK_DELAY_SECONDS:-5}"
            RELEASES_TO_KEEP="${FAIRSHARE_RELEASES_TO_KEEP:-5}"
            RELEASE_DIR="${RELEASES_DIR}/${RELEASE_ID}"
            BACKEND_JAR="${RELEASE_DIR}/backend.jar"
            FRONTEND_DIR="${RELEASE_DIR}/frontend"
            CURRENT_TARGET=""

            log() {
              printf '[deploy] %s\n' "$1"
            }

            fail() {
              printf '[deploy] ERROR: %s\n' "$1" >&2
              exit 1
            }

            ensure_release_contents() {
              [ -f "$BACKEND_JAR" ] || fail "Missing backend jar at ${BACKEND_JAR}"
              [ -f "${FRONTEND_DIR}/index.html" ] || fail "Missing frontend build at ${FRONTEND_DIR}"
            }

            write_frontend_htaccess() {
              cat > "${FRONTEND_DIR}/.htaccess" <<'HTACCESS'
            RewriteEngine On
            RewriteBase /fairshare/

            RewriteRule ^api/ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /fairshare/index.html [L]
            HTACCESS
            }

            capture_current_release() {
              if [ -L "$CURRENT_LINK" ] && [ -e "$CURRENT_LINK" ]; then
                CURRENT_TARGET="$(readlink "$CURRENT_LINK")"
                ln -sfn "$CURRENT_TARGET" "$PREVIOUS_LINK"
                log "Current release is ${CURRENT_TARGET}"
              else
                CURRENT_TARGET=""
                log "No current release detected"
              fi
            }

            point_live_release() {
              ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"
              rm -rf "$PUBLIC_LINK"
              ln -s "$RELEASE_DIR/frontend" "$PUBLIC_LINK"
            }

            restore_previous_release() {
              if [ -z "$CURRENT_TARGET" ] || [ ! -d "$CURRENT_TARGET" ]; then
                fail "Rollback required but no previous release is available"
              fi
              log "Rolling back to ${CURRENT_TARGET}"
              ln -sfn "$CURRENT_TARGET" "$CURRENT_LINK"
              rm -rf "$PUBLIC_LINK"
              ln -s "$CURRENT_TARGET/frontend" "$PUBLIC_LINK"
              supervisorctl restart "$SERVICE_NAME"
            }

            restart_backend() {
              supervisorctl restart "$SERVICE_NAME"
            }

            wait_for_healthcheck() {
              local attempt
              for attempt in $(seq 1 "$HEALTHCHECK_ATTEMPTS"); do
                if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL" >/dev/null; then
                  log "Health check succeeded on attempt ${attempt}/${HEALTHCHECK_ATTEMPTS}"
                  return 0
                fi
                log "Health check failed on attempt ${attempt}/${HEALTHCHECK_ATTEMPTS}; waiting ${HEALTHCHECK_DELAY_SECONDS}s"
                sleep "$HEALTHCHECK_DELAY_SECONDS"
              done
              return 1
            }

            cleanup_old_releases() {
              local current_live_target
              local old_release
              local release_count
              local releases_to_remove
              local -a releases

              if [ "$RELEASES_TO_KEEP" -lt 1 ]; then
                return 0
              fi

              mapfile -t releases < <(find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d | sort)
              release_count="${#releases[@]}"
              if [ "$release_count" -le "$RELEASES_TO_KEEP" ]; then
                return 0
              fi

              releases_to_remove=$((release_count - RELEASES_TO_KEEP))
              current_live_target="$(readlink "$CURRENT_LINK")"

              for ((i = 0; i < releases_to_remove; i += 1)); do
                old_release="${releases[$i]}"
                if [ -n "$CURRENT_TARGET" ] && [ "$old_release" = "$CURRENT_TARGET" ]; then
                  continue
                fi
                if [ "$current_live_target" = "$old_release" ]; then
                  continue
                fi
                rm -rf "$old_release"
                log "Removed old release ${old_release}"
              done
            }

            main() {
              mkdir -p "$RELEASES_DIR" "$PUBLIC_ROOT"
              ensure_release_contents
              write_frontend_htaccess
              capture_current_release
              point_live_release
              restart_backend

              if wait_for_healthcheck; then
                cleanup_old_releases
                log "Deployment successful"
                exit 0
              fi

              log "Health check did not recover in time"
              restore_previous_release
              log "Rollback finished; marking deployment as failed"
              exit 1
            }

            main "$@"
            EOF
            chmod +x ~/fairshare/scripts/deploy_release.sh

      - name: Activate release with rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          FAIRSHARE_RELEASE_ID: ${{ env.FAIRSHARE_RELEASE_ID }}
          FAIRSHARE_HEALTHCHECK_URL: ${{ secrets.FAIRSHARE_HEALTHCHECK_URL }}
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FAIRSHARE_RELEASE_ID,FAIRSHARE_HEALTHCHECK_URL
          script: |
            ~/fairshare/scripts/deploy_release.sh

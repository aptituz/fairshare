name: Deploy Uberspace

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend
        working-directory: backend
        run: |
          ./gradlew bootJar -x test
          jar_path=$(ls build/libs/*.jar | head -n 1)
          cp "$jar_path" ../backend.jar

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: /
          VITE_API_BASE_URL: /fairshare
        run: |
          npm ci
          npm run build

      - name: Ensure remote folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/fairshare ~/fairshare/logs ~/html

      - name: Configure Apache routing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > ~/html/.htaccess <<'EOF'
            RewriteEngine On
            
            RewriteRule ^fairshare/api/ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
            EOF

      - name: Configure supervisord service
        uses: appleboy/ssh-action@v1.0.3
        env:
          FAIRSHARE_BACKEND_PORT: ${{ secrets.FAIRSHARE_BACKEND_PORT }}
          FAIRSHARE_DB_URL: ${{ secrets.FAIRSHARE_DB_URL }}
          FAIRSHARE_DB_USERNAME: ${{ secrets.FAIRSHARE_DB_USERNAME }}
          FAIRSHARE_DB_PASSWORD: ${{ secrets.FAIRSHARE_DB_PASSWORD }}
          FAIRSHARE_JWT_SECRET: ${{ secrets.FAIRSHARE_JWT_SECRET }}
          FAIRSHARE_CORS_ALLOWED_ORIGINS: ${{ secrets.FAIRSHARE_CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FAIRSHARE_BACKEND_PORT,FAIRSHARE_DB_URL,FAIRSHARE_DB_USERNAME,FAIRSHARE_DB_PASSWORD,FAIRSHARE_JWT_SECRET,FAIRSHARE_CORS_ALLOWED_ORIGINS
          script: |
            cat > ~/etc/services.d/fairshare-backend.ini <<EOF
            [program:fairshare-backend]
            command=java -jar %(ENV_HOME)s/fairshare/backend.jar --server.port=${FAIRSHARE_BACKEND_PORT} --server.servlet.context-path=/fairshare
            directory=%(ENV_HOME)s/fairshare
            autostart=true
            autorestart=true
            startsecs=10
            redirect_stderr=true
            stdout_logfile=%(ENV_HOME)s/fairshare/logs/backend.log
            environment=PORT="${FAIRSHARE_BACKEND_PORT}",SERVER_PORT="${FAIRSHARE_BACKEND_PORT}",FAIRSHARE_CONTEXT_PATH="/fairshare",SPRING_DATASOURCE_URL="${FAIRSHARE_DB_URL}",SPRING_DATASOURCE_USERNAME="${FAIRSHARE_DB_USERNAME}",SPRING_DATASOURCE_PASSWORD="${FAIRSHARE_DB_PASSWORD}",JWT_SECRET="${FAIRSHARE_JWT_SECRET}",FAIRSHARE_CORS_ALLOWED_ORIGINS="${FAIRSHARE_CORS_ALLOWED_ORIGINS}"
            EOF
            supervisorctl reread
            supervisorctl update

      - name: Upload backend jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend.jar
          target: ~/fairshare

      - name: Upload frontend assets
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: ~/html/
          remote_host: ${{ secrets.UBERSPACE_HOST }}
          remote_user: ${{ secrets.UBERSPACE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Activate backend jar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            supervisorctl restart fairshare-backend
